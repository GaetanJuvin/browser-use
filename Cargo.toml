[package]
name = "browser-use"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust CLI, native host, MCP server and SDK for your real Chrome browser"
license = "MIT"
repository = "https://github.com/GaetanJuvin/browser-use"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "browser-use"
path = "src/main.rs"
